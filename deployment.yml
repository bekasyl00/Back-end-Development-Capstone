# Replace REPLACE_NAMESPACE with the actual registry namespace before applying.
# Create djangoserver-config and djangoserver-secret in the deployment namespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    run: djangoserver
  name: djangoserver
spec:
  replicas: 1
  selector:
    matchLabels:
      run: djangoserver
  template:
    metadata:
      labels:
        run: djangoserver
    spec:
      containers:
        - image: us.icr.io/REPLACE_NAMESPACE/djangoserver:1
          imagePullPolicy: Always
          name: djangoserver
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: djangoserver-config
            - secretRef:
                name: djangoserver-secret
          env:
            - name: PORT
              value: "8000"
            - name: DJANGO_DB_PATH
              value: /tmp/django.sqlite3
          readinessProbe:
            httpGet:
              path: /
              port: 8000
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8000
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: djangoserver
spec:
  selector:
    run: djangoserver
  ports:
    - name: http
      port: 8000
      targetPort: 8000
